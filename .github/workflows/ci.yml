name: Continuous Integration
# Every step here is allowed to fail the build.
#
# The previous version of this workflow had seven jobs and ten `|| true` /
# `|| echo` / "skipping..." fallbacks, and never ran `nix flake check` at all.
# It reported success on 2026-06-05 while the flake could not evaluate a single
# host. If a check cannot fail, it is not a check — so there are no
# failure-swallowing constructs below at all: no `|| true`, no `continue-on-error`.
on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # ---------------------------------------------------------------------------
  # Evaluation gate. `nix flake check --no-build` evaluates every entry in
  # nixosConfigurations, darwinConfigurations and homeConfigurations. This is
  # what catches removed packages and renamed options.
  # ---------------------------------------------------------------------------
  evaluate:
    name: Evaluate flake
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Show flake outputs
        run: nix flake show --all-systems
      - name: nix flake check (evaluate everything)
        run: nix flake check --no-build --show-trace
  # ---------------------------------------------------------------------------
  # Lint and formatting gates, built as real derivations from the flake so the
  # local `nix flake check` and CI can never disagree about the rules.
  # ---------------------------------------------------------------------------
  quality:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        check: [statix-check, deadnix-check, shellcheck-check, treefmt, pre-commit-check]
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Build check ${{ matrix.check }}
        run: nix build --no-link --print-build-logs ".#checks.x86_64-linux.${{ matrix.check }}"
  # ---------------------------------------------------------------------------
  # Instantiate each host. `nix flake check` does not force every option, so
  # module conflicts (two definitions of boot.loader.timeout, say) only surface
  # when the derivation is actually realised. --dry-run does that without
  # downloading the closure.
  # ---------------------------------------------------------------------------
  hosts:
    name: Instantiate ${{ matrix.host }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        host:
          - desktop-template
          - laptop-template
          - server-template
          - wsl2-template
          - desktop-test
          - test-server
          - test-workstation
          - test-gaming
          - qemu-vm
          - microvm
          - installer-minimal
          - installer-desktop
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Instantiate ${{ matrix.host }}
        run: |
          nix build --dry-run --show-trace \
            ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
  # ---------------------------------------------------------------------------
  # The dev shell is the documented entry point ("nix develop"), so prove it
  # builds and that the tooling the docs promise is actually on PATH.
  # ---------------------------------------------------------------------------
  devshell:
    name: Dev shell
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Tooling promised by the README is present
        run: |
          nix develop --command bash -euo pipefail -c '
            for tool in just nixfmt nixd statix deadnix treefmt shellcheck shfmt; do
              command -v "$tool" >/dev/null || { echo "MISSING from dev shell: $tool"; exit 1; }
              echo "ok: $tool"
            done
            just --list >/dev/null
          '
  # ---------------------------------------------------------------------------
  # NixOS VM integration tests. These boot a real machine under QEMU, so they
  # are the slowest job — but they are also the only ones that prove services
  # actually come up.
  # ---------------------------------------------------------------------------
  vm-tests:
    name: VM test ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        test: [vm-test-desktop, vm-test-server]
    steps:
      - uses: actions/checkout@v5
      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - name: Run ${{ matrix.test }}
        run: nix build --no-link --print-build-logs ".#checks.x86_64-linux.${{ matrix.test }}"
  # ---------------------------------------------------------------------------
  # The GitHub Pages site. Building it here means a broken link or a Liquid
  # error fails the PR rather than silently shipping to the published site.
  # ---------------------------------------------------------------------------
  site:
    name: Site build & link check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Import docs/ into the site
        run: bash site/scripts/import-docs.sh docs site/docs
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./site
          destination: ./_site
      - name: Check internal links
        run: |
          python3 - <<'PY'
          import os, re, sys
          root, base = "_site", "/nixos-template"
          hrefs = re.compile(r'(?:href|src)="([^"]+)"')
          bad, pages = [], 0
          for dp, _, fs in os.walk(root):
              for f in fs:
                  if not f.endswith(".html"):
                      continue
                  pages += 1
                  page = os.path.join(dp, f)
                  rel = os.path.relpath(page, root)
                  html = open(page, encoding="utf-8", errors="ignore").read()
                  for h in hrefs.findall(html):
                      if h.startswith(("http://", "https://", "mailto:", "#", "data:")):
                          continue
                      target = h.split("#")[0].split("?")[0]
                      if not target:
                          continue
                      if target.startswith(base):
                          p = os.path.join(root, target[len(base):].lstrip("/"))
                      elif target.startswith("/"):
                          p = os.path.join(root, target.lstrip("/"))
                      else:
                          p = os.path.join(dp, target)
                      if os.path.isdir(p):
                          p = os.path.join(p, "index.html")
                      if not os.path.exists(p):
                          bad.append((rel, h))
          print(f"checked {pages} pages")
          if bad:
              for p, h in bad:
                  print(f"BROKEN: {p} -> {h}")
              sys.exit(1)
          print("no broken internal links")
          PY
  # ---------------------------------------------------------------------------
  # Single required status for branch protection: green only if everything
  # above is green. Without this, adding a job to the matrix silently escapes
  # any "required checks" rule configured on the branch.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [evaluate, quality, hosts, devshell, vm-tests, site]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job did not succeed
        run: |
          echo 'needs: ${{ toJSON(needs) }}'
          if echo '${{ toJSON(needs) }}' | grep -q '"result": *"\(failure\|cancelled\|skipped\)"'; then
            echo "At least one CI job did not succeed."
            exit 1
          fi
          echo "All CI jobs succeeded."
